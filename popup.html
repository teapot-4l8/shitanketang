<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; font: 13px/1.5 "Microsoft YaHei", sans-serif; color: #e8e8e8; background: #1e2229; }
    header { padding: 10px 14px; background: #161a20; border-bottom: 1px solid #2c333d;
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 15px; font-weight: 600; }
    #status { font-size: 12px; padding: 2px 10px; border-radius: 10px; background: #555; }
    #status.running { background: #e74c3c; }
    #status.done { background: #27ae60; }
    #status.error { background: #c0392b; }
    section { padding: 10px 14px; border-bottom: 1px solid #2c333d; }
    label { display: block; margin: 6px 0 3px; color: #9aa4b0; font-size: 12px; }
    input[type=text], input[type=number], select { width: 100%; padding: 5px 8px; border: 1px solid #3a434f; border-radius: 5px;
      background: #262c35; color: #e8e8e8; font-size: 12px; }
    select { cursor: pointer; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    #courses { max-height: 170px; overflow-y: auto; }
    .course { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 4px 0;
              background: #262c35; border-radius: 6px; cursor: pointer; }
    .course:hover { background: #2e3641; }
    .course .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .course .rate { color: #f0a30a; font-size: 12px; min-width: 44px; text-align: right; }
    button { padding: 8px 0; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
             cursor: pointer; width: 100%; }
    #startBtn { background: #e74c3c; color: #fff; }
    #startBtn:hover { background: #ff6b57; }
    #startBtn:disabled { background: #7a3b34; cursor: not-allowed; }
    #stopBtn { background: #3a434f; color: #cfd6de; width: 100%; margin-top: 6px; }
    #stopBtn:hover { background: #46505e; }
    #progressWrap { display: none; }
    #progressBar { height: 8px; background: #262c35; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #e74c3c, #f0a30a); transition: width .4s; }
    #curNode { color: #9aa4b0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #log { height: 130px; overflow-y: auto; background: #161a20; border-radius: 6px; padding: 8px;
           font: 11px/1.6 Consolas, monospace; color: #8fa1b3; white-space: pre-wrap; word-break: break-all; }
    .muted { color: #6b7683; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>🎓 JCE 学习助手</h1>
    <span id="status">未连接</span>
  </header>

  <section id="tokenSec">
    <label>Token（页面自动抓取，此处为手动兜底）</label>
    <input type="text" id="token" placeholder="留空则使用页面自动抓取的 token">
    <div class="muted" id="tokenInfo"></div>
  </section>

  <section>
    <label>课程列表 <span id="reloadTip"></span></label>
    <div id="courses"><div class="muted">加载中…</div></div>
    <div class="row" style="margin-top:6px">
      <div><label>倍速（可手动输入，运行中修改即时生效）</label>
        <input type="number" id="speed" list="speedList" min="0.5" max="16" step="0.5" value="8">
        <datalist id="speedList">
          <option value="1">1.0x 最稳</option>
          <option value="2">2.0x</option>
          <option value="4">4.0x</option>
          <option value="8">8.0x 实测最快有效</option>
          <option value="12">12x 会被防快进打折</option>
        </datalist>
      </div>
      <div><label>弹题</label>
        <select id="quizMode">
          <option value="auto" selected>自动答题</option>
          <option value="skip">跳过答题</option>
        </select>
      </div>
    </div>
  </section>

  <section id="progressWrap">
    <label>当前：<span id="curCourse"></span></label>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="curNode">—</div>
  </section>

  <section>
    <button id="startBtn">▶ 开始挂机</button>
    <button id="stopBtn">■ 停止</button>
    <div class="muted" id="hint">请先打开课程学习页面（能看到左侧目录树），再点开始。</div>
  </section>

  <section>
    <label>运行日志</label>
    <div id="log">—</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
